name: Java CI with Maven

on:
  push:
    branches: [ "v2" ]
  pull_request:
    branches: [ "v2" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # LFSのプッシュを安定させるため、全履歴を取得

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn -B clean package

    # 成果物のコミットと通常プッシュ（リポジトリ側のLFS設定が自動適用されます）
    - name: Commit and Push JAR
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # 通常、targetフォルダは.gitignoreに入っているため -f (強制) で追加します
        git add -f target/*.jar
        
        if ! git diff --cached --quiet; then
          git commit -m "build: automated build artifact (.jar) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "No changes in JAR file."
        fi
