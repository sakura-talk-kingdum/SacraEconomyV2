name: Java CI with Maven

on:
  push:
    branches: [ "v2" ]
    paths:
      - "pom.xml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check pom.xml version change
      id: check_version
      run: |
        PREV_VERSION=$(git show HEAD~1:pom.xml | grep -m 1 "<version>" | sed -e 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/')
        CURR_VERSION=$(cat pom.xml | grep -m 1 "<version>" | sed -e 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/')
        
        echo "Previous: $PREV_VERSION"
        echo "Current:  $CURR_VERSION"
        
        if [ "$PREV_VERSION" = "$CURR_VERSION" ]; then
          echo "Version didn't change. Skipping."
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "Version changed. Proceeding."
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "version=v$CURR_VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 25
      if: steps.check_version.outputs.changed == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      if: steps.check_version.outputs.changed == 'true'
      run: mvn -B clean package

    # 前バージョンのJARをインデックスから削除し、新しいJARのみを追跡する
    - name: Commit and Push JAR to Repository
      if: steps.check_version.outputs.changed == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # 1. 既存の target/*.jar をGitの追跡から一旦すべて削除（ファイルがなくてもエラーにしない）
        git rm -f target/*.jar 2>/dev/null || true
        
        # 2. 今回ビルドされた新しいJARのみを強制追加
        git add -f target/*.jar
        
        if ! git diff --cached --quiet; then
          git commit -m "chore: automated build artifact for version ${{ steps.check_version.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "No changes in JAR file."
        fi

    - name: Create GitHub Release and Tag
      if: steps.check_version.outputs.changed == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.check_version.outputs.version }}
        name: Release ${{ steps.check_version.outputs.version }}
        body: |
          Automated release for version ${{ steps.check_version.outputs.version }}.
          The build artifact has been committed to the repository and is also available below.
        draft: false
        prerelease: false
        files: target/*.jar
